/* ── OT Report (existing logic, preserved) ── */
function renderOTReport() {
  var ym      = reportMonth;
  var recs    = attendance.filter(function(r){ return r.date.slice(0,7)===ym; }).sort(function(a,b){return a.date.localeCompare(b.date);});
  var payPerHr= getPayPerHr(ym); var curSalRep=getSalary(ym); var apprDays=getApprForMonth(ym).holidayDays||0;
  var totalOT=0, workingDays=0, weekendDays=0, holPayCount=0, holOTCount=0, totalHolPay=0, totalOTPay=0, lateCount=0;
  var holPayIdx=attendance.filter(function(r){return r.dayType==='holiday'&&r.date.slice(0,7)<ym;}).length;
  recs.forEach(function(r){
    var ot=calcOT(r); totalOT+=ot;
    if(r.dayType==='working'){workingDays++;if(timeToMins(r.dutyOn)>DUTY_ON&&!r.leaveType)lateCount++;}
    else if(r.dayType==='weekend')weekendDays++;
    else if(r.dayType==='holiday'){holPayCount++;if(holPayIdx<apprDays)totalHolPay+=getPayPerDay(r.date.slice(0,7));holPayIdx++;}
    else if(r.dayType==='holiday-ot')holOTCount++;
    if(ot>0) totalOTPay+=ot*getPayPerHr(r.date.slice(0,7));
  });

  var months=allDataMonths();
  var monthOpts=months.map(function(m){return '<option value="'+m+'"'+(m===ym?' selected':'')+'>'+monthName(m)+'</option>';}).join('');

  var holPayIdx2=attendance.filter(function(r){return r.dayType==='holiday'&&r.date.slice(0,7)<ym;}).length;
  var tableRows=recs.map(function(rec){
    var ot=calcOT(rec);
    var late=(rec.dayType==='working'&&timeToMins(rec.dutyOn)>DUTY_ON&&!rec.leaveType)?timeToMins(rec.dutyOn)-DUTY_ON:0;
    var otStart=rec.dayType==='working'&&!rec.leaveType?minsToTime(DUTY_OFF+late):'—';
    var rowClass=rec.dayType==='holiday'?'row-holiday':rec.dayType==='holiday-ot'?'row-holiday-ot':rec.dayType==='weekend'?'row-weekend':
      rec.leaveType?(rec.leaveType.indexOf('short')===0?'row-short':'row-half'):(rec.dayType==='leave-casual'?'row-leave':rec.dayType==='leave-sick'?'row-sick':'');
    var otCell, payCell;
    if(rec.dayType==='holiday'){
      var el=holPayIdx2<apprDays; otCell='<em style="font-size:11px;color:var(--text3)">Holiday Pay</em>';
      payCell=el?money(getPayPerDay(rec.date.slice(0,7))):'<span style="color:var(--text3)">—</span>'; holPayIdx2++;
    } else if(rec.leaveType||rec.dayType==='leave-casual'||rec.dayType==='leave-sick') {
      otCell='<span class="badge badge-sl" style="font-size:10px">'+(rec.leaveType?leaveTypeLabel(rec.leaveType):dayLabel(rec.dayType))+'</span>';
      payCell='<span style="color:var(--text3)">—</span>';
    } else {
      otCell=ot>0?'<strong>'+fmt(ot)+' h</strong>':'<span style="color:var(--text3)">—</span>';
      payCell=ot>0?money(ot*getPayPerHr(rec.date.slice(0,7))):'<span style="color:var(--text3)">—</span>';
    }
    return '<tr class="'+rowClass+'">'+
      '<td><strong>'+fmtDate(rec.date)+'</strong></td>'+
      '<td>'+dayBadge(rec.dayType)+'</td>'+
      '<td>'+(rec.dutyOn||'—')+(late?'<br><span style="font-size:10px;color:#b07010">(+'+late+'m late)</span>':'')+'</td>'+
      '<td>'+(rec.dutyOff||'—')+'</td>'+
      '<td style="text-align:center">'+otStart+'</td>'+
      '<td style="text-align:right">'+otCell+'</td>'+
      '<td style="text-align:right">'+payCell+'</td>'+
    '</tr>';
  }).join('');

  var tfoot='<tfoot><tr>'+
    '<td colspan="4">Total — '+recs.length+' days recorded</td><td></td>'+
    '<td style="text-align:right">'+fmt(totalOT)+' h OT</td>'+
    '<td style="text-align:right">'+money(totalOTPay+totalHolPay)+'</td>'+
  '</tr></tfoot>';

  return '<div class="card no-print">'+
    '<div class="card-title">Monthly Attendance Report</div>'+
    '<div class="report-controls">'+
      '<div><label>Select Month</label><select onchange="updateReportMonth(this.value)" style="min-width:200px">'+monthOpts+'</select></div>'+
      (recs.length>0?'<button class="btn btn-primary" onclick="window.print()" style="height:36px;align-self:flex-end">🖨️ Print / Save PDF</button>':'')+'</div>'+
    (recs.length===0?'<div class="empty">No records for '+monthName(ym)+'. Add records in Attendance tab.</div>':'')+'</div>'+
  (recs.length>0?
  '<div class="report-preview">'+
    '<div class="report-header-bar"><div class="report-title">Monthly Attendance Report — '+monthName(ym)+'</div>'+
    '<div class="report-subtitle">Generated '+fmtDate(todayStr())+(curSalRep?' &bull; Basic Salary: '+money(curSalRep)+' / month':'')+'</div></div>'+
    '<div class="report-summary">'+
      '<div class="report-summary-item"><div class="rs-label">Working Days</div><div class="rs-value">'+workingDays+'</div><div class="rs-sub">recorded</div></div>'+
      '<div class="report-summary-item"><div class="rs-label">Weekend Days</div><div class="rs-value">'+weekendDays+'</div><div class="rs-sub">worked</div></div>'+
      '<div class="report-summary-item"><div class="rs-label">Holiday Pay</div><div class="rs-value">'+holPayCount+'</div><div class="rs-sub">days</div></div>'+
      '<div class="report-summary-item"><div class="rs-label">Total OT</div><div class="rs-value">'+fmt(totalOT,2)+' h</div><div class="rs-sub">'+(totalOTPay?money(totalOTPay):'set salary')+'</div></div>'+
      '<div class="report-summary-item"><div class="rs-label">Late Arrivals</div><div class="rs-value">'+lateCount+'</div><div class="rs-sub">working days</div></div>'+
    '</div>'+
    '<div class="report-table-wrap"><table class="report-table">'+
      '<thead><tr><th>Date</th><th>Day Type</th><th>Duty On</th><th>Duty Off</th><th style="text-align:center">OT Start</th><th style="text-align:right">OT Hours</th><th style="text-align:right">Pay</th></tr></thead>'+
      '<tbody>'+tableRows+'</tbody>'+tfoot+'</table></div>'+
    '<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--text2);padding:10px 18px;border-top:1px solid var(--border)">'+
      '<span>🟩 Holiday (Pay)</span><span>🟪 Holiday (OT)</span><span>🟨 Weekend</span>'+
      '<span>🟧 Short Leave</span><span>🟥 Half Day / Full Leave</span>'+
    '</div>'+
    '<div class="report-footer">OT rate: salary ÷ 240 per hour &bull; Holiday pay: salary ÷ 30 per day</div>'+
  '</div>':'');
}

/* ── Leave Report ── */
function renderLeaveReport() {
  var scopeTabs =
    '<div class="mode-tabs no-print" style="margin-bottom:16px">'+
      '<button class="mode-tab'+(lvRptScope==='monthly'?' active':'')+'" onclick="updateLvRptScope(\'monthly\')">Monthly</button>'+

  if (lvRptScope==='monthly') return scopeTabs + renderLeaveReportMonthly();
  return scopeTabs + renderLeaveReportAnnual();
}

function renderLeaveReportMonthly() {
  var months=allDataMonths();
  var monthOpts=months.map(function(m){return '<option value="'+m+'"'+(m===lvRptMonth?' selected':'')+'>'+monthName(m)+'</option>';}).join('');
  var ym=lvRptMonth;
  var recs=attendance.filter(function(r){return r.date.slice(0,7)===ym;}).sort(function(a,b){return a.date.localeCompare(b.date);});

  var slCount=0, hdCount=0, hdCasual=0, hdSick=0, fdCasual=0, fdSick=0, graceCount=0;
  recs.forEach(function(r){
    if(r.leaveType==='grace') graceCount++;
    else if(r.leaveType==='short-am'||r.leaveType==='short-pm') slCount++;
    else if(r.leaveType==='half-morning'||r.leaveType==='half-noon'){
      hdCount++; if(r.halfLeavePool==='sick')hdSick+=0.5;else hdCasual+=0.5;
    } else if(r.dayType==='leave-casual') fdCasual++;
    else if(r.dayType==='leave-sick') fdSick++;
  });
  var totalAbsent=fdCasual+fdSick+hdCasual+hdSick;

  var tableRows=recs.map(function(r){
    var isAbs=(r.dayType==='leave-casual'||r.dayType==='leave-sick');
    /* Show grace days too in the report */
    if(!isLeaveDay(r) && r.leaveType!=='grace') return '';
    var typeLabel, rowCls;
    if(r.leaveType==='grace'){typeLabel='Grace Day';rowCls='';}
    else if(r.dayType==='leave-casual'){typeLabel='Casual Leave (Full Day)';rowCls='row-leave';}
    else if(r.dayType==='leave-sick'){typeLabel='Sick/Rest Leave (Full Day)';rowCls='row-sick';}
    else if(r.leaveType==='short-am'){typeLabel='Short Leave (Morning)';rowCls='row-short';}
    else if(r.leaveType==='short-pm'){typeLabel='Short Leave (Evening)';rowCls='row-short';}
    else if(r.leaveType==='half-morning'){typeLabel='Half Day (Late Arrival)';rowCls='row-half';}
    else if(r.leaveType==='half-noon'){typeLabel='Half Day (Noon)';rowCls='row-half';}
    else {return '';}
    var deduction, pool;
    if(r.leaveType==='grace'){deduction='—';pool='None (Grace Day)';}
    else if(r.dayType==='leave-casual'){deduction='1 day';pool='Casual';}
    else if(r.dayType==='leave-sick'){deduction='1 day';pool='Sick/Rest';}
    else if(r.leaveType==='short-am'||r.leaveType==='short-pm'){deduction='—';pool='None (Short Leave)';}
    else{deduction='0.5 day';pool=(r.halfLeavePool==='sick'?'Sick/Rest':'Casual');}
    var times=isAbs?'—':(r.dutyOn&&r.dutyOff?r.dutyOn+' – '+r.dutyOff:'—');
    return '<tr class="'+rowCls+'">'+
      '<td><strong>'+fmtDate(r.date)+'</strong></td>'+
      '<td>'+typeLabel+'</td>'+
      '<td>'+times+'</td>'+
      '<td style="text-align:center">'+deduction+'</td>'+
      '<td>'+pool+'</td>'+
      '<td style="text-align:center">'+(r.leaveType==='grace'?'<span style="color:var(--text3);font-size:11px">N/A</span>':(r.leaveApproved?'<span class="badge badge-ok">✓ Approved</span>':'<span class="badge badge-pend">⏳ Pending</span>'))+'</td>'+
    '</tr>';
  }).join('');

  return '<div class="card no-print">'+
    '<div class="card-title">Monthly Leave Report</div>'+
    '<div class="report-controls">'+
      '<div><label>Select Month</label><select onchange="updateLvRptMonth(this.value)" style="min-width:200px">'+monthOpts+'</select></div>'+
      '<button class="btn btn-primary" onclick="window.print()" style="height:36px;align-self:flex-end">🖨️ Print / Save PDF</button>'+
    '</div></div>'+

  '<div class="report-preview">'+
    '<div class="report-header-bar">'+
      '<div class="report-title">Monthly Leave Report — '+monthName(ym)+'</div>'+
      '<div class="report-subtitle">Generated '+fmtDate(todayStr())+'</div>'+
    '</div>'+
    '<div class="report-summary">'+
      '<div class="report-summary-item"><div class="rs-label">Grace Days</div><div class="rs-value">'+graceCount+'</div><div class="rs-sub">of '+MAX_GRACE+' allowed</div></div>'+
      '<div class="report-summary-item"><div class="rs-label">Short Leaves</div><div class="rs-value">'+slCount+'</div><div class="rs-sub">of '+MAX_SL+' allowed</div></div>'+
      '<div class="report-summary-item"><div class="rs-label">Half Days</div><div class="rs-value">'+hdCount+'</div><div class="rs-sub">'+(hdCount>0?fmt(hdCount*0.5,1)+' days deducted':'no half days')+'</div></div>'+
      '<div class="report-summary-item"><div class="rs-label">Casual Leave</div><div class="rs-value">'+fmt(fdCasual+hdCasual,1)+'</div><div class="rs-sub">days from casual pool</div></div>'+
      '<div class="report-summary-item"><div class="rs-label">Sick/Rest Leave</div><div class="rs-value">'+fmt(fdSick+hdSick,1)+'</div><div class="rs-sub">days from sick pool</div></div>'+
      '<div class="report-summary-item"><div class="rs-label">Total Absent Days</div><div class="rs-value">'+fmt(totalAbsent,1)+'</div><div class="rs-sub">casual + sick deductions</div></div>'+
    '</div>'+
    (tableRows
      ?'<div class="report-table-wrap"><table class="report-table">'+
          '<thead><tr><th>Date</th><th>Leave Type</th><th>Times</th><th style="text-align:center">Deduction</th><th>Pool</th><th style="text-align:center">Approval</th></tr></thead>'+
          '<tbody>'+tableRows+'</tbody>'+
          '<tfoot><tr><td colspan="3">Total leave records — '+ym+'</td><td style="text-align:center">'+fmt(totalAbsent+slCount,1)+'</td><td>—</td><td></td></tr></tfoot>'+
        '</table></div>'
      :'<div class="empty" style="padding:32px">No leave records for '+monthName(ym)+'.</div>')+
    '<div class="report-footer">Short Leaves do not deduct from annual leave. Half Days deduct 0.5 from specified pool.</div>'+
  '</div>';
}

function renderLeaveReportAnnual() {
  var years=allDataYears();
  var yearOpts=years.map(function(y){return '<option value="'+y+'"'+(y===lvRptYear?' selected':'')+'>'+y+'</option>';}).join('');
  var lb=getLeaveBalance(lvRptYear);

  /* Monthly breakdown */
  var months=allDataMonths().filter(function(m){return m.slice(0,4)===lvRptYear;});
  var monthBreakRows=months.map(function(m){
    var mRecs=attendance.filter(function(r){return r.date.slice(0,7)===m;});
    var sl=0, hd=0, hdC=0, hdS=0, fdC=0, fdS=0;
    mRecs.forEach(function(r){
      if(r.leaveType==='short-am'||r.leaveType==='short-pm')sl++;
      else if(r.leaveType==='half-morning'||r.leaveType==='half-noon'){hd++;if(r.halfLeavePool==='sick')hdS+=0.5;else hdC+=0.5;}
      else if(r.dayType==='leave-casual')fdC++;
      else if(r.dayType==='leave-sick')fdS++;
    });
    var total=fdC+fdS+hdC+hdS;
    return '<tr>'+
      '<td><strong>'+monthName(m)+'</strong></td>'+
      '<td style="text-align:center">'+sl+'</td>'+
      '<td style="text-align:center">'+hd+'</td>'+
      '<td style="text-align:center">'+fmt(fdC+hdC,1)+'</td>'+
      '<td style="text-align:center">'+fmt(fdS+hdS,1)+'</td>'+
      '<td style="text-align:center;font-weight:600">'+fmt(total,1)+'</td>'+
    '</tr>';
  }).join('');

  /* All leave records */
  var leaveRecs=attendance.filter(function(r){return r.date.slice(0,4)===lvRptYear&&isLeaveDay(r);}).sort(function(a,b){return a.date.localeCompare(b.date);});
  var allRows=leaveRecs.map(function(r){
    var typeLabel, rowCls, deduction, pool;
    if(r.dayType==='leave-casual'){typeLabel='Casual Leave';rowCls='row-leave';deduction='1 day';pool='Casual';}
    else if(r.dayType==='leave-sick'){typeLabel='Sick/Rest Leave';rowCls='row-sick';deduction='1 day';pool='Sick';}
    else if(r.leaveType==='short-am'){typeLabel='Short Leave (AM)';rowCls='row-short';deduction='—';pool='None';}
    else if(r.leaveType==='short-pm'){typeLabel='Short Leave (PM)';rowCls='row-short';deduction='—';pool='None';}
    else if(r.leaveType==='half-morning'){typeLabel='Half Day (Late)';rowCls='row-half';deduction='0.5';pool=(r.halfLeavePool==='sick'?'Sick':'Casual');}
    else if(r.leaveType==='half-noon'){typeLabel='Half Day (Noon)';rowCls='row-half';deduction='0.5';pool=(r.halfLeavePool==='sick'?'Sick':'Casual');}
    else{return '';}
    return '<tr class="'+rowCls+'">'+
      '<td><strong>'+fmtDate(r.date)+'</strong></td>'+
      '<td>'+r.date.slice(0,7)+'</td>'+
      '<td>'+typeLabel+'</td>'+
      '<td style="text-align:center">'+deduction+'</td>'+
      '<td>'+pool+'</td>'+
      '<td style="text-align:center">'+(r.leaveApproved?'<span class="badge badge-ok">✓</span>':'<span class="badge badge-pend">⏳</span>')+'</td>'+
    '</tr>';
  }).join('');

  return '<div class="card no-print">'+
    '<div class="card-title">Annual Leave Report</div>'+
    '<div class="report-controls">'+
      '<div><label>Select Year</label><select onchange="updateLvRptYear(this.value)" style="min-width:120px">'+yearOpts+'</select></div>'+
      '<button class="btn btn-primary" onclick="window.print()" style="height:36px;align-self:flex-end">🖨️ Print / Save PDF</button>'+
    '</div></div>'+

  '<div class="report-preview">'+
    '<div class="report-header-bar">'+
      '<div class="report-title">Annual Leave Report — '+lvRptYear+'</div>'+
      '<div class="report-subtitle">Generated '+fmtDate(todayStr())+' &bull; Entitlement: '+MAX_CASUAL+' Casual + '+MAX_SICK+' Sick = '+(MAX_CASUAL+MAX_SICK)+' Total</div>'+
    '</div>'+
    '<div class="report-summary">'+
      '<div class="report-summary-item"><div class="rs-label">Casual Used</div><div class="rs-value">'+fmt(lb.casualUsed,1)+'</div><div class="rs-sub">of '+MAX_CASUAL+' days</div></div>'+
      '<div class="report-summary-item"><div class="rs-label">Casual Remaining</div><div class="rs-value" style="color:var(--green)">'+fmt(lb.casualRem,1)+'</div><div class="rs-sub">days left</div></div>'+
      '<div class="report-summary-item"><div class="rs-label">Sick Used</div><div class="rs-value">'+fmt(lb.sickUsed,1)+'</div><div class="rs-sub">of '+MAX_SICK+' days</div></div>'+
      '<div class="report-summary-item"><div class="rs-label">Sick Remaining</div><div class="rs-value" style="color:var(--teal)">'+fmt(lb.sickRem,1)+'</div><div class="rs-sub">days left</div></div>'+
      '<div class="report-summary-item"><div class="rs-label">Total Used</div><div class="rs-value">'+fmt(lb.totalUsed,1)+'</div><div class="rs-sub">of '+(MAX_CASUAL+MAX_SICK)+'</div></div>'+
      '<div class="report-summary-item"><div class="rs-label">Total Remaining</div><div class="rs-value">'+fmt(lb.totalRem,1)+'</div><div class="rs-sub">days left</div></div>'+
    '</div>'+

    (monthBreakRows
      ?'<div style="padding:0 0 0 0"><table class="report-table">'+
          '<thead><tr><th>Month</th><th style="text-align:center">Short Leaves</th><th style="text-align:center">Half Days</th><th style="text-align:center">Casual Deducted</th><th style="text-align:center">Sick Deducted</th><th style="text-align:center">Total Deducted</th></tr></thead>'+
          '<tbody>'+monthBreakRows+'</tbody>'+
          '<tfoot><tr><td><strong>Year Total</strong></td><td style="text-align:center">'+Object.values(lb.shortByMonth).reduce(function(a,b){return a+b;},0)+'</td><td style="text-align:center"></td>'+
            '<td style="text-align:center;font-weight:600">'+fmt(lb.casualUsed,1)+'</td>'+
            '<td style="text-align:center;font-weight:600">'+fmt(lb.sickUsed,1)+'</td>'+
            '<td style="text-align:center;font-weight:600">'+fmt(lb.totalUsed,1)+'</td></tr></tfoot>'+
        '</table></div>':'')+

    (allRows
      ?'<div class="report-table-wrap"><table class="report-table">'+
          '<thead><tr><th>Date</th><th>Month</th><th>Leave Type</th><th style="text-align:center">Days Deducted</th><th>Pool</th><th style="text-align:center">Approval</th></tr></thead>'+
          '<tbody>'+allRows+'</tbody></table></div>'
      :'<div class="empty" style="padding:32px">No leave records for '+lvRptYear+'.</div>')+

    '<div class="report-footer">Annual entitlement: '+MAX_CASUAL+' Casual + '+MAX_SICK+' Sick/Rest = '+(MAX_CASUAL+MAX_SICK)+' total &bull; Short Leaves (max '+MAX_SL+'/month) do not reduce annual balance</div>'+
  '</div>';
}

/* ════════════════════════════════════════════
   RENDER
   ════════════════════════════════════════════ */
function render() {
  var root = document.getElementById('root');
  if      (currentTab===0) root.innerHTML = renderTab0();
  else if (currentTab===1) root.innerHTML = renderTab1();
  else if (currentTab===2) root.innerHTML = renderTab2();
  else if (currentTab===3) root.innerHTML = renderTab3();
  else if (currentTab===4) root.innerHTML = renderTab4();
  else                      root.innerHTML = renderTab5();
}

/* Live clock — updates every second on the today card */
setInterval(function() {
  var el = document.getElementById('live-clock');
  if (el) el.textContent = nowTimeStr();
}, 1000);

initFromSheets();
</script>
</body>
</html>
