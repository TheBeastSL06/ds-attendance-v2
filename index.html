<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance &amp; OT Manager</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f4f0; --surface: #ffffff; --surface2: #f0efe9; --surface3: #e8e7e0;
    --border: #d8d7cf; --border2: #c5c4bb;
    --text: #1a1a18; --text2: #5c5c58; --text3: #9c9b96;
    --blue: #1a5fa8; --blue-bg: #e8f1fb; --blue-text: #1a5fa8;
    --green: #1a7a4a; --green-bg: #e6f5ed; --green-text: #1a7a4a;
    --amber: #a05a10; --amber-bg: #fef3e2; --amber-text: #a05a10;
    --red: #b52d2d; --red-bg: #fdeaea; --red-text: #b52d2d;
    --purple: #6340b8; --purple-bg: #f0ecfb; --purple-text: #6340b8;
    --teal: #0d7377; --teal-bg: #d9f5f5; --teal-text: #0d7377;
    --radius: 10px; --radius-sm: 6px;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a; --surface: #252523; --surface2: #2e2e2b; --surface3: #363633;
      --border: #3a3a37; --border2: #4a4a46; --text: #f0efe9; --text2: #a0a09a; --text3: #686864;
      --blue: #5b9de0; --blue-bg: #1a2d42; --blue-text: #7ab3e8;
      --green: #4ca870; --green-bg: #1a2e22; --green-text: #6ab888;
      --amber: #d4903a; --amber-bg: #2e2010; --amber-text: #d4903a;
      --red: #e06060; --red-bg: #2e1a1a; --red-text: #e06060;
      --purple: #a688f0; --purple-bg: #241a38; --purple-text: #a688f0;
      --teal: #2abfbf; --teal-bg: #0e2828; --teal-text: #2abfbf;
    }
  }

  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; line-height: 1.5; }

  .app-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 20px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow); }
  .app-logo { font-size: 14px; font-weight: 700; color: var(--text); padding: 16px 0; white-space: nowrap; letter-spacing: -0.02em; }
  .app-logo span { color: var(--blue); }
  .tabs { display: flex; gap: 1px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn { padding: 18px 13px 16px; font-size: 12.5px; font-weight: 500; color: var(--text2); background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; transition: all .15s; }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }

  .main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .card-title { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text3); margin-bottom: 16px; }

  .form-grid { display: grid; gap: 12px; margin-bottom: 14px; }
  .cols2 { grid-template-columns: 1fr 1fr; }
  .cols3 { grid-template-columns: 1fr 1fr 1fr; }

  label { display: block; font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 5px; }
  input, select { width: 100%; padding: 8px 11px; font-size: 13px; font-family: inherit; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); outline: none; transition: border-color .15s, box-shadow .15s; }
  input:focus, select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(26,95,168,.12); background: var(--surface); }
  input[type="number"] { -moz-appearance: textfield; }
  input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }

  .btn { padding: 8px 16px; font-size: 13px; font-weight: 500; font-family: inherit; background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); cursor: pointer; transition: all .15s; }
  .btn:hover { background: var(--surface2); border-color: var(--text3); }
  .btn:active { transform: scale(.98); }
  .btn-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  .btn-primary:hover { opacity: .88; background: var(--blue); }
  .btn-danger { background: var(--red-bg); color: var(--red-text); border-color: transparent; padding: 5px 10px; font-size: 12px; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }
  .btn-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text3); text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }

  .badge { display: inline-block; padding: 2px 8px; font-size: 11px; font-weight: 500; border-radius: 20px; white-space: nowrap; }
  .badge-working    { background: var(--blue-bg);   color: var(--blue-text); }
  .badge-holiday    { background: var(--green-bg);  color: var(--green-text); }
  .badge-weekend    { background: var(--amber-bg);  color: var(--amber-text); }
  .badge-holiday-ot { background: var(--purple-bg); color: var(--purple-text); }
  .badge-lc  { background: var(--red-bg);    color: var(--red-text); }
  .badge-ls  { background: var(--teal-bg);   color: var(--teal-text); }
  .badge-sl  { background: var(--amber-bg);  color: var(--amber-text); }
  .badge-hd  { background: var(--red-bg);    color: var(--red-text); }
  .badge-ok   { background: var(--green-bg);  color: var(--green-text); font-size: 10px; }
  .badge-pend { background: var(--surface3);  color: var(--text3); font-size: 10px; }
  .badge-grace{ background: var(--blue-bg);   color: var(--blue-text); }

  .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .metric { background: var(--surface2); border-radius: var(--radius-sm); padding: 14px 16px; }
  .metric-label { font-size: 11px; font-weight: 500; color: var(--text3); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em; }
  .metric-value { font-size: 22px; font-weight: 600; letter-spacing: -0.03em; color: var(--text); line-height: 1; }
  .metric-sub { font-size: 11px; color: var(--text3); margin-top: 5px; }

  .progress-bar { height: 5px; background: var(--surface3); border-radius: 3px; margin-top: 8px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 3px; transition: width .4s ease; background: var(--blue); }
  .progress-fill.warn { background: var(--amber); }
  .progress-fill.over { background: var(--red); }

  .ot-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); gap: 10px; }
  .ot-row:last-child { border-bottom: none; }

  .empty { text-align: center; padding: 32px; color: var(--text3); font-size: 13px; }

  .alert { padding: 10px 14px; border-radius: var(--radius-sm); font-size: 12px; margin-bottom: 12px; border-left: 3px solid; }
  .alert-warning { background: var(--amber-bg); color: var(--amber-text); border-color: var(--amber); }
  .alert-info    { background: var(--blue-bg);  color: var(--blue-text);  border-color: var(--blue); }
  .alert-success { background: var(--green-bg); color: var(--green-text); border-color: var(--green); }
  .alert-danger  { background: var(--red-bg);   color: var(--red-text);   border-color: var(--red); }

  .sep { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

  .circle-num { width: 28px; height: 28px; border-radius: 50%; background: var(--green-bg); color: var(--green-text); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; flex-shrink: 0; }
  .circle-ot  { width: 28px; height: 28px; border-radius: 50%; background: var(--purple-bg); color: var(--purple-text); display: inline-flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }

  .ot-hrs  { font-weight: 600; color: var(--blue); }
  .ot-pay  { font-size: 12px; color: var(--green); font-weight: 500; }
  .ot-date { font-size: 12px; color: var(--text3); margin-top: 2px; }
  .late-tag { font-size: 11px; color: var(--amber); margin-left: 4px; }

  .split-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

  /* Leave bar */
  .lv-bar-wrap { margin: 10px 0 4px; }
  .lv-bar-row  { display: flex; justify-content: space-between; font-size: 11px; color: var(--text2); margin-bottom: 4px; }
  .lv-bar-track{ height: 7px; background: var(--surface3); border-radius: 4px; overflow: hidden; }
  .lv-bar-fill { height: 100%; border-radius: 4px; transition: width .4s; }
  .fill-red    { background: var(--red); }
  .fill-green  { background: var(--green); }
  .fill-teal   { background: var(--teal); }
  .fill-amber  { background: var(--amber); }

  /* Approval toggle button */
  .appr-btn { padding: 3px 9px; font-size: 11px; font-weight: 500; border-radius: 20px; border: 1px solid; cursor: pointer; font-family: inherit; transition: all .15s; }
  .appr-btn.approved  { background: var(--green-bg); color: var(--green-text); border-color: var(--green); }
  .appr-btn.pending   { background: var(--surface3); color: var(--text3); border-color: var(--border2); }
  .appr-btn:hover { opacity: .8; }

  /* Report styles */
  .report-controls { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .report-controls > div { display: flex; flex-direction: column; gap: 4px; }
  .report-preview { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); margin-top: 4px; }
  .report-header-bar { background: var(--surface2); padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .report-title { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; color: var(--text); }
  .report-subtitle { font-size: 12px; color: var(--text3); margin-top: 3px; }
  .report-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); border-bottom: 1px solid var(--border); }
  .report-summary-item { padding: 12px 16px; border-right: 1px solid var(--border); }
  .report-summary-item:last-child { border-right: none; }
  .rs-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text3); margin-bottom: 4px; }
  .rs-value { font-size: 20px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; line-height: 1; }
  .rs-sub   { font-size: 11px; color: var(--text3); margin-top: 3px; }
  .report-table-wrap { overflow-x: auto; }
  .report-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .report-table th { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--text3); text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--surface2); }
  .report-table td { padding: 9px 14px; border-bottom: 1px solid var(--border); color: var(--text); vertical-align: middle; }
  .report-table tr:last-child td { border-bottom: none; }
  .report-table tfoot td { font-weight: 700; background: var(--surface2); border-top: 2px solid var(--border2); padding: 10px 14px; }
  .report-table tbody tr.row-holiday    td { background: #edf8f2; }
  .report-table tbody tr.row-holiday-ot td { background: #f2edfb; }
  .report-table tbody tr.row-weekend    td { background: #fdf7e8; }
  .report-table tbody tr.row-leave      td { background: #fdeaea; }
  .report-table tbody tr.row-sick       td { background: #e6f8f8; }
  .report-table tbody tr.row-short      td { background: #fef3e2; }
  .report-table tbody tr.row-half       td { background: #fff0ea; }
  .report-footer { padding: 10px 18px; font-size: 11px; color: var(--text3); border-top: 1px solid var(--border); text-align: right; }

  .mode-tabs { display: flex; gap: 4px; background: var(--surface2); border-radius: var(--radius-sm); padding: 3px; margin-bottom: 20px; width: fit-content; border: 1px solid var(--border); }
  .mode-tab { padding: 6px 14px; font-size: 12px; font-weight: 500; border: none; border-radius: 4px; cursor: pointer; background: none; color: var(--text2); transition: all .15s; font-family: inherit; }
  .mode-tab.active { background: var(--surface); color: var(--blue); box-shadow: var(--shadow); }

  .info-box { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 12px; color: var(--text2); margin-bottom: 14px; }
  .info-box strong { color: var(--text); }

  /* ── Late Indicator Panel ── */
  .late-panel { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 12px; }
  .late-panel-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--text3); margin-bottom: 10px; }
  .late-panel-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--border); gap: 10px; }
  .late-panel-row:last-child { border-bottom: none; }
  .late-panel-lbl { font-size: 12px; color: var(--text2); }
  .late-panel-val { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; }
  .late-panel-val.ok    { color: var(--green); }
  .late-panel-val.warn  { color: var(--amber); }
  .late-panel-val.bad   { color: var(--red); }
  .late-panel-note { margin-top: 10px; font-size: 12px; padding: 7px 10px; border-radius: 5px; }
  .lpn-grace  { background: var(--blue-bg);   color: var(--blue-text); }
  .lpn-sl     { background: var(--amber-bg);  color: var(--amber-text); }
  .lpn-hd     { background: var(--red-bg);    color: var(--red-text); }
  .lpn-ontime { background: var(--green-bg);  color: var(--green-text); }

  @media (max-width: 600px) {
    .cols2, .cols3, .split-grid { grid-template-columns: 1fr; }
    .app-header { gap: 0; }
    .app-logo { display: none; }
  }

  @media print {
    body { background: #fff !important; color: #000 !important; }
    .app-header, .no-print { display: none !important; }
    .main { padding: 0 !important; max-width: 100% !important; }
    .card { box-shadow: none !important; }
    .report-preview { border: none !important; }
    .report-table tbody tr.row-holiday    td { background: #edf8f2 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .report-table tbody tr.row-holiday-ot td { background: #f2edfb !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .report-table tbody tr.row-weekend    td { background: #fdf7e8 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .report-table tbody tr.row-leave      td { background: #fdeaea !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .report-table tbody tr.row-sick       td { background: #e6f8f8 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .report-table tbody tr.row-short      td { background: #fef3e2 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .report-table tbody tr.row-half       td { background: #fff0ea !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .report-header-bar, .report-table th, .report-table tfoot td { background: #f2f2f0 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .report-summary { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    @page { margin: 1.5cm; size: A4 portrait; }
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-logo">DS <span>Attend</span></div>
  <nav class="tabs">
    <button class="tab-btn active" onclick="switchTab(0)">📋 Attendance</button>
    <button class="tab-btn"        onclick="switchTab(1)">✅ Approved OT</button>
    <button class="tab-btn"        onclick="switchTab(2)">⏱ OT Calc</button>
    <button class="tab-btn"        onclick="switchTab(3)">📊 Dashboard</button>
    <button class="tab-btn"        onclick="switchTab(4)">🏖️ Leave</button>
    <button class="tab-btn"        onclick="switchTab(5)">🖨️ Reports</button>
  </nav>
  <div style="margin-left:auto;display:flex;align-items:center;gap:8px;padding-right:4px;flex-shrink:0">
    <span id="user-badge" style="font-size:11.5px;white-space:nowrap;color:var(--text2);font-weight:500;
          background:var(--surface2);border:1px solid var(--border);padding:4px 9px;border-radius:20px"></span>
    <button onclick="switchUser()" title="Switch user"
      style="padding:5px 10px;font-size:12px;font-family:inherit;background:var(--surface2);border:1px solid var(--border);
             border-radius:6px;color:var(--text2);cursor:pointer;white-space:nowrap">↩ Switch</button>
    <span id="sync-indicator" style="font-size:11.5px;white-space:nowrap;color:var(--text3)">☁️ Cloud</span>
    <button onclick="reloadFromCloud()" title="Reload latest data from Google Sheets"
      style="padding:5px 10px;font-size:12px;font-family:inherit;background:var(--surface2);
             border:1px solid var(--border);border-radius:6px;color:var(--text2);cursor:pointer;white-space:nowrap">
      🔄 Reload
    </button>
  </div>
</header>

<main class="main" id="root"></main>

<script>
/* ════════════════════════════════════════════
   GOOGLE SHEETS BACKEND CONFIG
   ════════════════════════════════════════════
   Paste your Apps Script Web App URL below.
   Leave empty ('') to use localStorage only.
   ════════════════════════════════════════════ */
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwwSu2Adoq1YftBy0QJImnZ16-6zy4_oNlqK29qHBAf5lFJet84D-HIjksb83ODNWK8iw/exec';   /* <-- PASTE YOUR WEB APP URL HERE */

/* ════════════════════════════════════════════
   CURRENT USER  (loaded before anything else)
   ════════════════════════════════════════════ */
var currentUser = (function() {
  try { var v = localStorage.getItem('ot_user'); return v ? JSON.parse(v) : null; } catch(e) { return null; }
})();

/* Prefix all data keys with NIC so each person's data is isolated in localStorage */
function userKey(k) {
  if (!currentUser) return k;
  return k + '_' + currentUser.nic.replace(/[^a-zA-Z0-9]/g, '_');
}

/* ════════════════════════════════════════════
   CONSTANTS
   ════════════════════════════════════════════ */
var DUTY_ON     = 8  * 60 + 30;  /* 08:30 */
var DUTY_OFF    = 16 * 60 + 15;  /* 16:15 */
var SL_AM_START = 9  * 60;       /* 09:00 – short leave morning start */
var SL_AM_END   = 10 * 60;       /* 10:00 – half day morning starts   */
var SL_PM_BASE  = 14 * 60 + 45;  /* 14:45 – evening short leave base  */
var HD_NOON     = 12 * 60;       /* 12:00 – half day noon threshold   */
var MAX_SL      = 2;             /* max short leaves per month        */
var MAX_GRACE   = 2;             /* max grace days per month          */
var MAX_CASUAL  = 21;            /* annual casual leave days          */
var MAX_SICK    = 24;            /* annual sick/rest leave days       */

/* ════════════════════════════════════════════
   HELPERS
   ════════════════════════════════════════════ */
function timeToMins(t) {
  if (!t) return null;
  var p = t.split(':'); return Number(p[0]) * 60 + Number(p[1]);
}
function minsToTime(m) {
  return String(Math.floor(m / 60)).padStart(2,'0') + ':' + String(m % 60).padStart(2,'0');
}
function fmtDate(d) {
  if (!d) return '';
  var p = d.split('-'); return p[2] + '/' + p[1] + '/' + p[0];
}
function todayStr() { return new Date().toISOString().slice(0,10); }
function fmt(n, dec) { return Number(n).toFixed(dec === undefined ? 2 : dec); }
function money(n) { return 'Rs.\u00a0' + Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function monthName(ym) {
  var p = ym.split('-');
  return new Date(+p[0], +p[1]-1, 1).toLocaleString('default',{month:'long',year:'numeric'});
}
function yearName(y) { return y; }

/* ════════════════════════════════════════════
   LEAVE CLASSIFICATION
   ════════════════════════════════════════════ */
/*
  Leave types stored in rec.leaveType:
    null           → normal working / OT day (on time, or covered late)
    'grace'        → grace day: arrived 8:30–9:00, left ≥ 16:15, within 2/month limit
                     (no leave deduction; OT starts at 16:15, not adjusted)
    'short-am'     → short leave morning (came 9:00–9:59, or grace day limit exceeded)
    'short-pm'     → short leave evening (left 14:45+late … 16:14+late)
    'half-morning' → half day, late arrival ≥ 10:00, or short-am limit also exceeded
    'half-noon'    → half day, left before 14:45+late (including noon)

  dayType additions:
    'leave-casual' → full day casual leave (absent)
    'leave-sick'   → full day sick/rest leave (absent)
*/

function countShortLeavesInMonth(ym, excludeId) {
  return attendance.filter(function(r) {
    return r.date.slice(0,7) === ym
      && r.id !== excludeId
      && (r.leaveType === 'short-am' || r.leaveType === 'short-pm');
  }).length;
}

function countGraceDaysInMonth(ym, excludeId) {
  return attendance.filter(function(r) {
    return r.date.slice(0,7) === ym
      && r.id !== excludeId
      && r.leaveType === 'grace';
  }).length;
}

/* Is this record a candidate for a grace day?
   Arrived between 8:30 and 9:00 AND left between 16:15 and (16:15+late)-1 min.
   If they covered the late (off >= DUTY_OFF+late) it is a normal working day, not grace. */
function isGraceCandidate(on, off) {
  if (on <= DUTY_ON || on >= SL_AM_START) return false;
  var late = on - DUTY_ON;
  return off >= DUTY_OFF && off < DUTY_OFF + late;
}

function autoClassifyLeave(rec, shortCountInMonth, graceCountInMonth) {
  /* Returns leaveType string or null. Only meaningful for dayType='working'. */
  if (rec.dayType !== 'working') return null;
  var on  = timeToMins(rec.dutyOn);
  var off = timeToMins(rec.dutyOff);
  if (on === null || off === null) return null;

  var late             = on > DUTY_ON ? on - DUTY_ON : 0;
  var effectiveDutyOff = DUTY_OFF + late;   /* adjusted shift-end           */
  var slPMThreshold    = SL_PM_BASE + late; /* earliest PM short lv         */

  /* ── GRACE DAY CHECK (arrives 8:30–9:00, leaves ≥ 16:15) ── */
  if (isGraceCandidate(on, off)) {
    if (graceCountInMonth < MAX_GRACE) return 'grace';
    /* Grace limit exceeded → falls into short / half pipeline */
    return shortCountInMonth < MAX_SL ? 'short-am' : 'half-morning';
  }

  /* ── MORNING ARRIVAL CHECKS ── */
  if (on >= SL_AM_START && on < SL_AM_END) {
    /* Came 9:00–9:59 → short leave AM (or half day if monthly SL limit hit) */
    return shortCountInMonth < MAX_SL ? 'short-am' : 'half-morning';
  }
  if (on >= SL_AM_END) {
    /* Came at or after 10:00 → half day regardless */
    return 'half-morning';
  }

  /* ── Arrived before 9:00 (not a grace candidate) → check early departure ── */
  if (off < effectiveDutyOff) {
    if (off >= slPMThreshold) {
      /* Left between 14:45+late and 16:14+late → Evening Short Leave (or half day) */
      return shortCountInMonth < MAX_SL ? 'short-pm' : 'half-noon';
    }
    /* Left before 14:45+late (noon or earlier) → Half Day Noon */
    return 'half-noon';
  }

  /* off >= effectiveDutyOff → normal working day (or OT if beyond) */
  return null;
}

function leaveTypeLabel(lt) {
  if (lt === 'grace')       return 'Grace Day';
  if (lt === 'short-am')    return 'Short Leave (Morning)';
  if (lt === 'short-pm')    return 'Short Leave (Evening)';
  if (lt === 'half-morning')return 'Half Day (Late Arrival)';
  if (lt === 'half-noon')   return 'Half Day (Noon)';
  return '';
}

function isLeaveDay(rec) {
  /* Grace days are NOT leave days — they are normal working days with no penalty */
  return rec.dayType === 'leave-casual' || rec.dayType === 'leave-sick'
    || rec.leaveType === 'short-am' || rec.leaveType === 'short-pm'
    || rec.leaveType === 'half-morning' || rec.leaveType === 'half-noon';
}

/* Leave balance for a given year string "YYYY" */
function getLeaveBalance(year) {
  var recs = attendance.filter(function(r){ return r.date.slice(0,4) === year; });
  var casual = 0, sick = 0;
  var shortByMonth = {};
  recs.forEach(function(r) {
    var ym = r.date.slice(0,7);
    if (r.leaveType === 'short-am' || r.leaveType === 'short-pm') {
      shortByMonth[ym] = (shortByMonth[ym]||0) + 1;
    } else if (r.leaveType === 'half-morning' || r.leaveType === 'half-noon') {
      var pool = r.halfLeavePool || 'casual';
      if (pool === 'sick') sick += 0.5; else casual += 0.5;
    } else if (r.dayType === 'leave-casual') {
      casual += 1;
    } else if (r.dayType === 'leave-sick') {
      sick += 1;
    }
  });
  return {
    casualUsed: casual, sickUsed: sick,
    casualRem:  MAX_CASUAL - casual, sickRem: MAX_SICK - sick,
    totalUsed:  casual + sick, totalRem: (MAX_CASUAL+MAX_SICK) - casual - sick,
    shortByMonth: shortByMonth
  };
}

/* ════════════════════════════════════════════
   OT CALCULATION
   ════════════════════════════════════════════ */
function calcOT(rec) {
  /* No OT on leave sub-types. Grace days DO earn OT (from DUTY_OFF+late, same as normal late days). */
  if (rec.leaveType === 'short-am' || rec.leaveType === 'short-pm' ||
      rec.leaveType === 'half-morning' || rec.leaveType === 'half-noon') return 0;
  if (rec.dayType === 'leave-casual' || rec.dayType === 'leave-sick') return 0;

  var on = timeToMins(rec.dutyOn), off = timeToMins(rec.dutyOff);
  if (on === null || off === null || off <= on) return 0;

  var ot;
  if (rec.dayType === 'working') {
    /* Grace day: late is forgiven for leave classification, but OT still starts at DUTY_OFF+late */
    var otBase = DUTY_OFF + (on > DUTY_ON ? on - DUTY_ON : 0);
    ot = (off - otBase) / 60;
    if (ot < 1) return 0;
  } else if (rec.dayType === 'weekend' || rec.dayType === 'holiday-ot') {
    ot = (off - on) / 60;
  } else {
    return 0;
  }
  return Math.floor(ot * 4) / 4; /* floor to nearest 15 min */
}

   STORAGE & STATE
   ════════════════════════════════════════════ */
function load(k, def) {
  try { var v = localStorage.getItem(userKey(k)); return v ? JSON.parse(v) : def; } catch(e) { return def; }
}
function save(k, v) {
  try { localStorage.setItem(userKey(k), JSON.stringify(v)); } catch(e) {}
  syncToSheets(k, v);
}

/* ════════════════════════════════════════════
   GOOGLE SHEETS SYNC
   ════════════════════════════════════════════
   POST uses URLSearchParams (form-encoded) so
   the body survives Apps Script's 302 redirect.
   ════════════════════════════════════════════ */

var _syncStatus = 'idle';  /* idle | saving | saved | error */

function setSyncStatus(s, msg) {
  _syncStatus = s;
  var el = document.getElementById('sync-indicator');
  if (!el) return;
  var icons = { idle:'☁️', saving:'🔄', saved:'✅', error:'⚠️' };
  var labels = { idle:'Cloud', saving:'Saving…', saved:'Saved', error:'Sync error' };
  el.textContent = (icons[s]||'☁️') + ' ' + (msg || labels[s] || s);
  el.style.color = (s==='error') ? 'var(--red-text)' : (s==='saved') ? 'var(--green-text)' : 'var(--text3)';
  if (s === 'saved') setTimeout(function(){ setSyncStatus('idle'); }, 3000);
}

function syncToSheets(key, value) {
  if (!SCRIPT_URL || !currentUser) return;
  var actionMap = { 'ot_att':'saveAttendance', 'ot_sal':'saveSalary', 'ot_appr':'saveApproved' };
  if (!actionMap[key]) return;

  setSyncStatus('saving');

  var params = new URLSearchParams();
  params.append('payload', JSON.stringify({
    action:   actionMap[key],
    data:     value,
    employee: currentUser.nic,
    empName:  currentUser.name || currentUser.nic
  }));

  fetch(SCRIPT_URL, { method: 'POST', body: params })
    .then(function(r) { return r.text(); })
    .then(function(t) {
      try {
        var d = JSON.parse(t);
        if (d.status === 'ok') setSyncStatus('saved');
        else { console.warn('Sheets warning:', d); setSyncStatus('error', '⚠️ ' + (d.message||'Error')); }
      } catch(e) { setSyncStatus('saved'); }
    })
    .catch(function(e) { console.warn('Sheets sync failed:', e); setSyncStatus('error'); });
}

function loadFromSheets(callback) {
  if (!SCRIPT_URL || !currentUser) { callback(false); return; }
  fetch(SCRIPT_URL + '?action=load&employee=' + encodeURIComponent(currentUser.nic))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (Array.isArray(data.attendance)) {
        attendance = data.attendance;
        try { localStorage.setItem(userKey('ot_att'), JSON.stringify(attendance)); } catch(e){}
      }
      if (data.salary && typeof data.salary === 'object') {
        salaryByMonth = data.salary;
        try { localStorage.setItem(userKey('ot_sal'), JSON.stringify(salaryByMonth)); } catch(e){}
      }
      if (data.approved && typeof data.approved === 'object') {
        approvedByMonth = data.approved;
        try { localStorage.setItem(userKey('ot_appr'), JSON.stringify(approvedByMonth)); } catch(e){}
      }
      setSyncStatus('saved', '✅ Loaded from cloud');
      callback(true);
    })
    .catch(function(e) {
      console.warn('Could not load from Sheets:', e);
      setSyncStatus('error', '⚠️ Offline — local cache');
      callback(false);
    });
}

function reloadFromCloud() {
  setSyncStatus('saving', '🔄 Loading…');
  loadFromSheets(function() { render(); });
}

function addRecord() {
  var dt = form.dayType;
  var isAbsent = (dt==='leave-casual'||dt==='leave-sick');

  if (!form.date) { alert('Please select a date.'); return; }
  if (!isAbsent) {
    if (!form.dutyOn||!form.dutyOff) { alert('Please fill in Duty On and Duty Off times.'); return; }
    if (timeToMins(form.dutyOff) <= timeToMins(form.dutyOn)) { alert('Duty Off must be after Duty On.'); return; }
  }

  /* Compute leave type */
  var leaveType     = null;
  var halfLeavePool = null;
  if (dt === 'working') {
    var ym = form.date.slice(0,7);
    var sc = countShortLeavesInMonth(ym, editId);
    var gc = countGraceDaysInMonth(ym, editId);
    leaveType = autoClassifyLeave(form, sc, gc);
    if (leaveType && leaveType.indexOf('half')===0) {
      halfLeavePool = form.halfLeavePool || 'casual';
    }
  }

  var rec = {
    id:            editId || Date.now().toString(),
    date:          form.date,
    dayType:       dt,
    dutyOn:        isAbsent ? '' : form.dutyOn,
    dutyOff:       isAbsent ? '' : form.dutyOff,
    leaveType:     leaveType,
    halfLeavePool: halfLeavePool,
    leaveApproved: form.leaveApproved || false
  };

  var exists = attendance.find(function(r){ return r.date===form.date && r.id!==editId; });
  if (exists && !confirm('A record for this date already exists. Replace it?')) return;

  attendance = attendance.filter(function(r){ return r.date!==form.date || r.id===editId; });
  if (editId) {
    attendance = attendance.map(function(r){ return r.id===editId ? rec : r; });
  } else {
    attendance.push(rec);
  }
  attendance.sort(function(a,b){ return a.date.localeCompare(b.date); });
  editId = null;
  save('ot_att', attendance);
  form = { date:todayStr(), dutyOn:'08:30', dutyOff:'16:15', dayType:'working', halfLeavePool:'casual', leaveApproved:false };
  render();
}

function nowTimeStr() {
  var n = new Date();
  return String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
}

  t.style.opacity = '1';

function quickRecordDutyOff() {
  if (!todayEntry) return;

  if (timeToMins(t) <= timeToMins(todayEntry.dutyOn)) {
    alert('Duty Off time (' + t + ') must be after Duty On (' + todayEntry.dutyOn + ').'); return;
  }
  /* Build and save the full record */
  var ym = todayEntry.date.slice(0,7);
  var sc = countShortLeavesInMonth(ym, null);
  var gc = countGraceDaysInMonth(ym, null);
  var tmpRec = { date: todayEntry.date, dayType: todayEntry.dayType, dutyOn: todayEntry.dutyOn, dutyOff: t };
  var leaveType     = autoClassifyLeave(tmpRec, sc, gc);
  var halfLeavePool = (leaveType && leaveType.indexOf('half')===0) ? 'casual' : null;

  var rec = {
    id:            Date.now().toString(),
    date:          todayEntry.date,
    dayType:       todayEntry.dayType,
    dutyOn:        todayEntry.dutyOn,
    dutyOff:       t,
    leaveType:     leaveType,
    halfLeavePool: halfLeavePool,
    leaveApproved: false
  };

  attendance = attendance.filter(function(r){ return r.date !== rec.date; });
  attendance.push(rec);
  attendance.sort(function(a,b){ return a.date.localeCompare(b.date); });
  save('ot_att', attendance);

  todayEntry = null;
  try { localStorage.removeItem(userKey('ot_today')); } catch(e) {}
  showToast('🕔 Duty Off recorded: ' + t + (leaveType ? ' — ' + leaveTypeLabel(leaveType) : ''));
  render();
}

function quickClearToday() {
  if (!confirm('Clear today\'s Duty On record?')) return;
  todayEntry = null;
  try { localStorage.removeItem(userKey('ot_today')); } catch(e) {}
  render();
}

function quickEditDutyOn() {
  if (!todayEntry) return;
  var corrected = prompt('Correct Duty On time:', todayEntry.dutyOn);
  if (!corrected) return;
  corrected = corrected.trim();
  if (!/^\d{2}:\d{2}$/.test(corrected)) { alert('Use HH:MM format (e.g. 08:35)'); return; }
  todayEntry.dutyOn = corrected;
  try { localStorage.setItem(userKey('ot_today'), JSON.stringify(todayEntry)); } catch(e) {}
  showToast('🕐 Duty On updated: ' + corrected);
  render();
}

    var isAbs = (existingRec.dayType==='leave-casual'||existingRec.dayType==='leave-sick');
    var ot    = calcOT(existingRec);
    return '<div class="card" style="border-left:3px solid var(--green);margin-bottom:16px">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">' +
        '<div><div class="card-title" style="margin-bottom:4px">✅ Today — ' + fmtDate(today) + '</div>' +
        '<div style="font-size:13px;color:var(--text2);display:flex;gap:16px;flex-wrap:wrap;margin-top:6px">' +
          '<span>' + dayBadge(existingRec.dayType) + '</span>' +
          (isAbs ? '' : '<span style="background:var(--green-bg);padding:4px 10px;border-radius:6px;color:var(--green-text);font-weight:600">🕐 ' + existingRec.dutyOn + '</span>') +
          (isAbs ? '' : '<span style="background:var(--blue-bg);padding:4px 10px;border-radius:6px;color:var(--blue-text);font-weight:600">🕔 ' + existingRec.dutyOff + '</span>') +
          (ot > 0 ? '<span style="color:var(--green-text);font-weight:600">⏱ OT: ' + fmt(ot) + 'h</span>' : '') +
          (existingRec.leaveType ? '<span>' + leaveBadge(existingRec.leaveType) + '</span>' : '') +

  /* ── State 2: Duty On recorded, waiting for Duty Off ── */

    return '<div class="card" style="border-left:3px solid var(--amber);margin-bottom:16px">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px">' +
        '<div class="card-title">⏳ Today — ' + fmtDate(today) + '</div>' +
        '<span id="live-clock" style="font-size:13px;font-weight:600;color:var(--text2);font-variant-numeric:tabular-nums"></span>' +
      '</div>' +
      '<div style="display:flex;align-items:stretch;gap:12px;flex-wrap:wrap;margin-bottom:14px">' +
        '<div style="flex:1;min-width:120px;background:var(--green-bg);border:1px solid var(--green);border-radius:10px;padding:14px 18px;text-align:center">' +
          '<div style="font-size:11px;color:var(--green-text);font-weight:700;letter-spacing:.04em;margin-bottom:4px">🕐 DUTY ON</div>' +
          '<div style="font-size:28px;font-weight:800;color:var(--green-text);font-variant-numeric:tabular-nums">' + todayEntry.dutyOn + '</div>' +
          '<div style="font-size:11px;color:var(--text3);margin-top:2px">recorded</div>' +
        '</div>' +
        '<div style="display:flex;align-items:center;color:var(--text3);font-size:20px">→</div>' +
        '<div style="flex:1;min-width:120px;background:var(--blue-bg);border:2px dashed var(--blue);border-radius:10px;padding:14px 18px;text-align:center;cursor:pointer" onclick="quickRecordDutyOff()">' +
          '<div style="font-size:11px;color:var(--blue-text);font-weight:700;letter-spacing:.04em;margin-bottom:4px">🕔 DUTY OFF</div>' +
          '<div style="font-size:18px;font-weight:700;color:var(--blue-text)">Tap to record</div>' +
          '<div style="font-size:11px;color:var(--text3);margin-top:2px">stamps current time</div>' +
        '</div>' +
      '</div>' +
      '<div style="display:flex;gap:8px">' +
        '<button class="btn btn-primary" style="flex:1;font-size:14px;padding:11px" onclick="quickRecordDutyOff()">🕔 Record Duty Off Now</button>' +
        '<button class="btn" onclick="quickEditDutyOn()" title="Correct duty on time">✏️ Edit In</button>' +
        '<button class="btn" onclick="quickClearToday()">✕ Clear</button>' +
      '</div></div>';
  }

  /* ── State 1: Nothing recorded yet ── */
  return '<div class="card" style="border-left:3px solid var(--border2);margin-bottom:16px">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:14px">' +
      '<div class="card-title">🗓️ Today — ' + fmtDate(today) + '</div>' +
      '<span id="live-clock" style="font-size:13px;font-weight:600;color:var(--text2);font-variant-numeric:tabular-nums"></span>' +

    '<button class="btn btn-primary" style="font-size:15px;padding:12px 28px;width:100%;letter-spacing:.01em" onclick="quickRecordDutyOn()">🕐 Record Duty On — stamps current time</button>' +
    '<div style="margin-top:8px;font-size:12px;color:var(--text3)">Tap when you arrive. Come back to record Duty Off when you leave.</div>' +
    '</div>';
}

/* ════════════════════════════════════════════
   TAB 0 – ATTENDANCE
   ════════════════════════════════════════════ */
function renderTab0() {
  var dt         = form.dayType;
  var isAbsent   = (dt==='leave-casual'||dt==='leave-sick');
  var isWorking  = (dt==='working');

  /* Compute preview leave classification */
  var ym         = form.date.slice(0,7);
  var sc         = countShortLeavesInMonth(ym, editId);
  var gc         = countGraceDaysInMonth(ym, editId);
  var detected   = (isWorking && form.dutyOn && form.dutyOff) ? autoClassifyLeave(form, sc, gc) : null;
  var isGrace    = detected === 'grace';
  var isHalf     = detected && detected.indexOf('half')===0;
  var isSL       = detected && detected.indexOf('short')===0;
  var previewOT  = (isWorking && form.dutyOn && form.dutyOff && !isSL && !isHalf)
                   ? calcOT(Object.assign({}, form, {leaveType: detected})) : null;

  var on  = timeToMins(form.dutyOn);
  var off = timeToMins(form.dutyOff);
  var late = (on && on > DUTY_ON) ? on - DUTY_ON : 0;
  var slPMShow   = minsToTime(SL_PM_BASE + late);
  var noonShow   = minsToTime(HD_NOON + late);
  var dutyOffEff = minsToTime(DUTY_OFF + late);   /* cover-late deadline  */
  var otStartStr = minsToTime(DUTY_OFF + late); /* OT always starts at DUTY_OFF+late, even on grace days */

  /* ── Live Late Indicator Panel ── */
  var latePanel = '';
  if (isWorking && form.dutyOn) {
    var panelRows = '';

    if (late === 0) {
      /* On time */
      panelRows += '<div class="late-panel-row"><span class="late-panel-lbl">Arrival status</span><span class="late-panel-val ok">✅ On time (or early)</span></div>';
      panelRows += '<div class="late-panel-row"><span class="late-panel-lbl">Cover late until</span><span class="late-panel-val ok">—  (no late minutes)</span></div>';
      panelRows += '<div class="late-panel-row"><span class="late-panel-lbl">OT starts at</span><span class="late-panel-val">' + minsToTime(DUTY_OFF) + '</span></div>';
      if (form.dutyOff && off) {
        var potOT = off > DUTY_OFF + 60 ? Math.floor(((off - DUTY_OFF) / 60) * 4) / 4 : 0;
        panelRows += '<div class="late-panel-row"><span class="late-panel-lbl">OT this entry</span><span class="late-panel-val'+(potOT>0?' ok':'')+'">'+(potOT>0?fmt(potOT)+' h':'—')+'</span></div>';
      }
    } else {
      /* Late */
      var graceSuffix = '';
      if (on < SL_AM_START) {
        /* Grace window (8:30–9:00) */
        var graceUsed = gc; /* excluding this record */
        var graceRem  = MAX_GRACE - graceUsed;
        if (graceRem > 0 && off && off >= DUTY_OFF) {
          graceSuffix = ' (Grace Day ' + (graceUsed+1) + '/' + MAX_GRACE + ')';
        } else if (graceRem <= 0 && off && off >= DUTY_OFF) {
          graceSuffix = ' (Grace limit reached — ' + (sc < MAX_SL ? 'Short Leave' : 'Half Day') + ')';
        }
      }
      panelRows += '<div class="late-panel-row"><span class="late-panel-lbl">Late by</span><span class="late-panel-val warn">⏰ ' + late + ' min' + graceSuffix + '</span></div>';
      panelRows += '<div class="late-panel-row"><span class="late-panel-lbl">Cover late until</span><span class="late-panel-val warn">' + dutyOffEff + ' <span style="font-size:11px;font-weight:400">(to complete full shift)</span></span></div>';
      panelRows += '<div class="late-panel-row"><span class="late-panel-lbl">OT starts at</span><span class="late-panel-val">' + otStartStr + ' <span style="font-size:11px;font-weight:400">' + (isGrace ? '(grace day — no leave deducted)' : '(after covering ' + late + ' min)') + '</span></span></div>';
      if (form.dutyOff && off) {
        var otBase2 = isGrace ? DUTY_OFF : DUTY_OFF + late;
        var potOT2  = off > otBase2 + 60 ? Math.floor(((off - otBase2) / 60) * 4) / 4 : 0;
        var noOT    = isSL || isHalf;
        panelRows += '<div class="late-panel-row"><span class="late-panel-lbl">OT this entry</span><span class="late-panel-val'+(potOT2>0&&!noOT?' ok':'')+'">'+(noOT?'— (leave day)':potOT2>0?fmt(potOT2)+' h':'—')+'</span></div>';
      }
    }

    /* Grace day note at bottom of panel */
    var graceNote = '';
    if (late > 0 && on < SL_AM_START) {
      var grUsed = gc; var grRem = MAX_GRACE - grUsed;
      if (off && off >= DUTY_OFF) {
        if (grRem > 0) {
          graceNote = '<div class="late-panel-note lpn-grace">🎟️ <strong>Grace Day</strong> — arrived '
            + late + ' min late but leaving at/after 16:15. Grace days used this month: <strong>'
            + grUsed + ' → ' + (grUsed+1) + ' / ' + MAX_GRACE + '</strong>. '
            + (grRem === 1 ? '<strong>Last grace day this month!</strong> ' : '')
            + 'No leave deducted. OT starts at <strong>' + minsToTime(DUTY_OFF+late) + '</strong> (after covering late).</div>';
        } else {
          graceNote = '<div class="late-panel-note lpn-'+(sc<MAX_SL?'sl':'hd')+'">⚠️ <strong>Grace limit reached</strong> ('
            + MAX_GRACE + '/' + MAX_GRACE + ' used). This counts as a <strong>'
            + (sc<MAX_SL?'Short Leave':'Half Day') + '</strong>. No OT.</div>';
        }
      } else if (off) {
        graceNote = '<div class="late-panel-note lpn-sl">ℹ️ Arrived in grace window (8:30–9:00) but leaving before 16:15 — does not qualify as a grace day.</div>';
      }
    } else if (late === 0) {
      if (sc < MAX_SL) {
        graceNote = '<div class="late-panel-note lpn-ontime">ℹ️ PM thresholds — Short leave: leave by <strong>'
          + slPMShow + '</strong> – <strong>' + dutyOffEff + '</strong>. Half day noon: leave before <strong>'
          + noonShow + '</strong>.</div>';
      } else {
        graceNote = '<div class="late-panel-note lpn-sl">⚠️ Short leave limit (<strong>' + MAX_SL + '/' + MAX_SL
          + '</strong>) reached this month. Any early departure = Half Day.</div>';
      }
    }

    latePanel = '<div class="late-panel"><div class="late-panel-title">🕐 Time Status</div>'
      + panelRows + graceNote + '</div>';
  }

  /* ── Alerts ── */
  var alerts = '';
  if (isAbsent) {
    var ab = getLeaveBalance(form.date.slice(0,4));
    var pool = dt==='leave-sick' ? 'Sick/Rest' : 'Casual';
    var rem  = dt==='leave-sick' ? ab.sickRem : ab.casualRem;
    var max  = dt==='leave-sick' ? MAX_SICK   : MAX_CASUAL;
    var cls  = rem <= 0 ? 'alert-danger' : rem <= 3 ? 'alert-warning' : 'alert-info';
    alerts += '<div class="alert '+cls+'">📅 Full Day Leave — <strong>'+pool+'</strong>. '
      +(rem>0?'<strong>'+rem+'</strong> days remaining ('+fmt(max-rem,0)+' / '+max+' used)':'<strong>No leave remaining!</strong> ('+max+' / '+max+' used)')+'.</div>';
  }
  if (detected && !isGrace) {
    var detLabel = leaveTypeLabel(detected);
    var detCls   = isSL ? 'alert-warning' : 'alert-danger';
    var extraMsg = '';
    if (isSL) {
      extraMsg = ' Short leaves this month: <strong>'+sc+'/'+MAX_SL+'</strong> already used.';
    }
    if (isHalf) {
      var ab2 = getLeaveBalance(form.date.slice(0,4));
      var halfPool = form.halfLeavePool||'casual';
      var halfRem  = halfPool==='sick' ? ab2.sickRem : ab2.casualRem;
      extraMsg = ' This will use <strong>0.5 day</strong> from your '+(halfPool==='sick'?'Sick':'Casual')+' leave ('+halfRem+' days remaining).';
    }
    alerts += '<div class="alert '+detCls+'">⚠️ Detected: <strong>'+detLabel+'</strong>.'+extraMsg+' No OT will be counted.</div>';
  }
  if (form.dayType==='holiday') alerts += '<div class="alert alert-success">📅 This day will count toward your approved Holiday Pay days.</div>';
  if (form.dayType==='holiday-ot') alerts += '<div class="alert alert-info">ℹ️ Holiday day — paid as OT hours only, no Holiday Pay day used.</div>';
  if (previewOT !== null && previewOT > 0) alerts += '<div class="alert alert-info">⏰ Preview OT: <strong>'+fmt(previewOT)+' hours</strong></div>';

  /* ── Form ── */
  var timeFields = isAbsent ? '' :
    '<div class="form-grid cols2">' +
      '<div><label>Duty On Time</label>' +
        '<div style="display:flex;gap:6px;align-items:center">' +
          '<input type="time" value="'+form.dutyOn+'" onchange="updateForm(\'dutyOn\',this.value)" style="flex:1">' +
          '<button type="button" onclick="updateForm(\'dutyOn\',nowTimeStr());render()" title="Stamp current time"' +
            ' style="padding:6px 10px;font-size:12px;background:var(--green-bg);border:1px solid var(--green);' +
            'border-radius:var(--radius-sm);color:var(--green-text);cursor:pointer;white-space:nowrap;font-family:inherit">⚡ Now</button>' +
        '</div></div>' +
      '<div><label>Duty Off Time</label>' +
        '<div style="display:flex;gap:6px;align-items:center">' +
          '<input type="time" value="'+form.dutyOff+'" onchange="updateForm(\'dutyOff\',this.value)" style="flex:1">' +
          '<button type="button" onclick="updateForm(\'dutyOff\',nowTimeStr());render()" title="Stamp current time"' +
            ' style="padding:6px 10px;font-size:12px;background:var(--blue-bg);border:1px solid var(--blue);' +
            'border-radius:var(--radius-sm);color:var(--blue-text);cursor:pointer;white-space:nowrap;font-family:inherit">⚡ Now</button>' +
        '</div></div>' +
    '</div>' + latePanel;

  var halfPoolField = (isHalf) ?
    '<div style="margin-bottom:14px"><label>Deduct Half Day from which leave pool?</label>' +
      '<select onchange="updateForm(\'halfLeavePool\',this.value)">' +
        '<option value="casual"'+(form.halfLeavePool==='casual'?' selected':'')+'>Casual Leave</option>' +
        '<option value="sick"'+(form.halfLeavePool==='sick'?' selected':'')+'>Sick / Rest Leave</option>' +
      '</select></div>' : '';

  var showApproval = isAbsent || (isWorking && !!detected && !isGrace);
  var approvalField = showApproval ?
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">' +
      '<label style="margin:0;font-size:12px;font-weight:500;color:var(--text2)">Leave Approval Status:</label>' +
      '<select onchange="updateForm(\'leaveApproved\',this.value)" style="width:auto">' +
        '<option value="false"'+(form.leaveApproved?'':' selected')+'>⏳ Pending</option>' +
        '<option value="true"'+(form.leaveApproved?' selected':'')+'>✓ Approved</option>' +
      '</select></div>' : '';

  var formHtml = '<div class="card"><div class="card-title">'+(editId?'✏️ Edit Record':'Mark Attendance')+'</div>' +
    '<div class="form-grid cols2">' +
      '<div><label>Date</label><input type="date" value="'+form.date+'" onchange="updateForm(\'date\',this.value)"></div>' +
      '<div><label>Day Type</label>' +
        '<select onchange="updateForm(\'dayType\',this.value)">' +
          '<option value="working"'     +(dt==='working'     ?' selected':'')+'>Working Day</option>' +
          '<option value="weekend"'     +(dt==='weekend'     ?' selected':'')+'>Weekend</option>' +
          '<option value="holiday"'     +(dt==='holiday'     ?' selected':'')+'>Public Holiday (Holiday Pay)</option>' +
          '<option value="holiday-ot"'  +(dt==='holiday-ot'  ?' selected':'')+'>Public Holiday (OT Only)</option>' +
          '<option value="leave-casual"'+(dt==='leave-casual'?' selected':'')+'>Casual Leave (Full Day Absent)</option>' +
          '<option value="leave-sick"'  +(dt==='leave-sick'  ?' selected':'')+'>Sick / Rest Leave (Full Day Absent)</option>' +
        '</select></div>' +
    '</div>' +
    timeFields +
    halfPoolField +
    approvalField +
    alerts +
    '<div class="btn-row">' +
      '<button class="btn btn-primary" onclick="addRecord()">'+(editId?'Update Record':'Add Record')+'</button>' +
      (editId?'<button class="btn" onclick="cancelEdit()">Cancel</button>':'') +
    '</div></div>';

  /* ── Records list with month filter ── */
  var months = allDataMonths();
  var filterOpts = '<option value="">All Months</option>';
  months.forEach(function(m){ filterOpts+='<option value="'+m+'"'+(m===attFilterMonth?' selected':'')+'>'+monthName(m)+'</option>'; });

  var filtered = attFilterMonth
    ? attendance.filter(function(r){ return r.date.slice(0,7)===attFilterMonth; })
    : attendance;

  var rows = '';
  for (var i=0;i<filtered.length;i++) {
    var r   = filtered[i];
    var ot  = calcOT(r);
    var isAbs = (r.dayType==='leave-casual'||r.dayType==='leave-sick');
    var late2 = (!isAbs && r.dayType==='working' && timeToMins(r.dutyOn)>DUTY_ON)
               ? timeToMins(r.dutyOn)-DUTY_ON : 0;

    var dutyOnCell  = isAbs ? '<span style="color:var(--text3)">—</span>'
                    : r.dutyOn+(late2?'<span class="late-tag">(+'+late2+'m late)</span>':'');
    var dutyOffCell = isAbs ? '<span style="color:var(--text3)">—</span>' : r.dutyOff;
    var leaveCell   = r.leaveType ? leaveBadge(r.leaveType) : '';
    var otCell      = ot>0 ? '<strong class="ot-hrs">'+fmt(ot)+'h</strong>' : '<span style="color:var(--text3)">—</span>';

    /* approval toggle — only for actual leave records (not grace) */
    var apprCell = isLeaveDay(r)
      ? '<button class="appr-btn '+(r.leaveApproved?'approved':'pending')+'" onclick="toggleLeaveApproval(\''+r.id+'\')">'+(r.leaveApproved?'✓ Approved':'⏳ Pending')+'</button>'
      : '';

    rows += '<tr>' +
      '<td><strong>'+fmtDate(r.date)+'</strong></td>' +
      '<td>'+dayBadge(r.dayType)+(leaveCell?' '+leaveCell:'')+'</td>' +
      '<td>'+dutyOnCell+'</td>' +
      '<td>'+dutyOffCell+'</td>' +
      '<td>'+otCell+'</td>' +
      '<td>'+apprCell+'</td>' +
      '<td style="display:flex;gap:6px">' +
        '<button class="btn btn-sm" onclick="startEdit(\''+r.id+'\')">Edit</button>' +
        '<button class="btn btn-danger" onclick="deleteRecord(\''+r.id+'\')">✕</button>' +
      '</td>' +
    '</tr>';
  }

  var tableHtml = '<div class="card">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px">' +
      '<div class="card-title" style="margin:0">Attendance Records <span style="font-weight:400;color:var(--text3)">('+filtered.length+')</span></div>' +
      '<div style="display:flex;align-items:center;gap:8px">' +
        '<label style="margin:0;white-space:nowrap">Filter:</label>' +
        '<select onchange="updateAttFilter(this.value)" style="min-width:170px">'+filterOpts+'</select>' +
      '</div>' +
    '</div>' +
    (filtered.length===0
      ? '<div class="empty">No records'+(attFilterMonth?' for '+monthName(attFilterMonth):'')+'. Add your first entry above.</div>'
      : '<div class="table-wrap"><table>' +
          '<thead><tr><th>Date</th><th>Type / Leave</th><th>Duty On</th><th>Duty Off</th><th>OT Hours</th><th>Approval</th><th style="width:110px"></th></tr></thead>' +
          '<tbody>'+rows+'</tbody></table></div>') +
  '</div>';

  return formHtml + tableHtml;
}

/* ════════════════════════════════════════════
   TAB 1 – APPROVED OT (unchanged)
   ════════════════════════════════════════════ */
function renderTab1() {
  var cur = getApprForMonth(approvedMonth);
  var curTotal = (Number(cur.central)||0)+(Number(cur.provincial)||0);
  var months = allDataMonths();
  var monthOpts = months.map(function(m){ return '<option value="'+m+'"'+(m===approvedMonth?' selected':'')+'>'+monthName(m)+'</option>'; }).join('');

  var configuredMonths = Object.keys(approvedByMonth).sort();
  var summaryRows='', gC=0, gP=0, gH=0;
  configuredMonths.forEach(function(ym) {
    var m=approvedByMonth[ym]; var mt=(Number(m.central)||0)+(Number(m.provincial)||0);
    gC+=Number(m.central)||0; gP+=Number(m.provincial)||0; gH+=Number(m.holidayDays)||0;
    summaryRows+='<tr'+(ym===approvedMonth?' style="background:var(--blue-bg)"':'')+'>'+
      '<td><strong>'+monthName(ym)+'</strong></td>'+
      '<td style="text-align:right">'+fmt(m.central||0,1)+' h</td>'+
      '<td style="text-align:right">'+fmt(m.provincial||0,1)+' h</td>'+
      '<td style="text-align:right;font-weight:600">'+fmt(mt,1)+' h</td>'+
      '<td style="text-align:right">'+(m.holidayDays||0)+' days</td>'+
    '</tr>';
  });

  return '<div class="card"><div class="card-title">Approved OT — Select Month</div>' +
    '<div style="margin-bottom:16px;max-width:280px"><label>Month</label><select onchange="updateApprovedMonth(this.value)">'+monthOpts+'</select></div>' +
    '<div style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:12px">'+monthName(approvedMonth)+'</div>' +
    '<div class="form-grid cols2">' +
      '<div><label>Central Government Approved OT (hours)</label><input type="number" min="0" step="0.5" value="'+(cur.central||'')+'" placeholder="e.g. 40" oninput="updateApproved(\'central\',this.value)"></div>' +
      '<div><label>Provincial Government Approved OT (hours)</label><input type="number" min="0" step="0.5" value="'+(cur.provincial||'')+'" placeholder="e.g. 20" oninput="updateApproved(\'provincial\',this.value)"></div>' +
    '</div>' +
    '<div style="max-width:300px;margin-bottom:4px"><label>Approved Holiday Pay Days</label><input type="number" min="0" value="'+(cur.holidayDays||'')+'" placeholder="e.g. 5" oninput="updateApproved(\'holidayDays\',this.value)"></div>' +
    '<div class="metric-grid" style="margin-top:16px">' +
      '<div class="metric"><div class="metric-label">This Month OT</div><div class="metric-value">'+fmt(curTotal,2)+' h</div><div class="metric-sub">Central + Provincial</div></div>' +
      '<div class="metric"><div class="metric-label">Holiday Pay Days</div><div class="metric-value">'+(cur.holidayDays||0)+'</div><div class="metric-sub">this month</div></div>' +

  (configuredMonths.length>0
    ?'<div class="card"><div class="card-title">All Months Summary</div>' +
      '<div class="table-wrap"><table>' +
        '<thead><tr><th>Month</th><th style="text-align:right">Central</th><th style="text-align:right">Provincial</th><th style="text-align:right">Total OT</th><th style="text-align:right">Hol. Days</th></tr></thead>' +
        '<tbody>'+summaryRows+'</tbody>' +
        '<tfoot><tr><td><strong>Grand Total</strong></td><td style="text-align:right;font-weight:600">'+fmt(gC,2)+' h</td><td style="text-align:right;font-weight:600">'+fmt(gP,2)+' h</td><td style="text-align:right;font-weight:600">'+fmt(gC+gP,2)+' h</td><td style="text-align:right;font-weight:600">'+gH+' days</td></tr></tfoot>' +

/* ════════════════════════════════════════════
   TAB 2 – OT CALCULATION
   ════════════════════════════════════════════ */
function renderTab2() {
  var holPayRecs = attendance.filter(function(r){ return r.dayType==='holiday'; });
  var holOTRecs  = attendance.filter(function(r){ return r.dayType==='holiday-ot'; });
  var apprDays   = totalApprHolDays();
  var totalOT=0, earnedOT=0, earnedHol=0, holEligible=0;
  attendance.forEach(function(r){ var ot=calcOT(r); totalOT+=ot; earnedOT+=ot*getPayPerHr(r.date.slice(0,7)); });
  for (var hi=0;hi<holPayRecs.length&&hi<apprDays;hi++){earnedHol+=getPayPerDay(holPayRecs[hi].date.slice(0,7));holEligible++;}

  var smSet={};
  for(var si=0;si<attendance.length;si++) smSet[attendance[si].date.slice(0,7)]=true;
  for(var sk in salaryByMonth) smSet[sk]=true; smSet[todayStr().slice(0,7)]=true;
  var smList=Object.keys(smSet).sort();
  var smOpts=smList.map(function(m){ return '<option value="'+m+'"'+(m===salaryMonth?' selected':'')+'>'+monthName(m)+'</option>'; }).join('');
  var curSal=getSalary(salaryMonth);

  var salMonths=Object.keys(salaryByMonth).filter(function(k){return salaryByMonth[k]>0;}).sort();
  var salRows=salMonths.map(function(tm){
    return '<tr'+(tm===salaryMonth?' style="background:var(--blue-bg)"':'')+'>'+
      '<td><strong>'+monthName(tm)+'</strong></td>'+
      '<td style="text-align:right">'+money(salaryByMonth[tm])+'</td>'+
      '<td style="text-align:right">'+money(salaryByMonth[tm]/240)+' /hr</td>'+
      '<td style="text-align:right">'+money(salaryByMonth[tm]/30)+' /day</td></tr>';
  }).join('');

  var otFiltered=attendance.filter(function(r){return calcOT(r)>0;});
  var otRows=otFiltered.map(function(r){
    var ot=calcOT(r); var rSal=getSalary(r.date.slice(0,7));
    var late=(r.dayType==='working'&&timeToMins(r.dutyOn)>DUTY_ON)?timeToMins(r.dutyOn)-DUTY_ON:0;
    var isGraceRec = r.leaveType === 'grace';
    var otStart=r.dayType==='working'
      ? minsToTime(DUTY_OFF+late)  /* always DUTY_OFF+late, including grace days */
      : r.dutyOn;
    var lateNote = isGraceRec ? ' (Grace Day — no leave deducted)'
      : (late ? ' ('+late+'m late)' : '');
    var note=r.dayType==='working'
      ?'Duty: '+r.dutyOn+'–'+r.dutyOff+' · OT starts '+otStart+lateNote
      :'Duty: '+r.dutyOn+'–'+r.dutyOff+' · All hours as OT';
    return '<div class="ot-row"><div>'+
      '<div style="font-weight:600">'+fmtDate(r.date)+' '+dayBadge(r.dayType)+'</div>'+
      '<div class="ot-date">'+note+'</div></div>'+
      '<div style="text-align:right;flex-shrink:0"><div class="ot-hrs">'+fmt(ot)+' h</div>'+(rSal?'<div class="ot-pay">'+money(ot*rSal/240)+'</div>':'<div class="ot-date">no salary set</div>')+'</div></div>';
  }).join('');

  var holPaySection='';
  if (holPayRecs.length>0) {
    var holRows=holPayRecs.map(function(hr,j){
      var hrSal=getSalary(hr.date.slice(0,7));
      return '<div class="ot-row"><div style="display:flex;align-items:center;gap:12px">'+
        '<div class="circle-num">'+(j+1)+'</div>'+
        '<div><div style="font-weight:600">'+fmtDate(hr.date)+'</div><div class="ot-date">'+hr.dutyOn+'–'+hr.dutyOff+' · flat daily rate</div></div></div>'+
        '<div style="text-align:right">'+(j<apprDays?'<span class="badge badge-holiday">Approved</span>'+(hrSal?'<div class="ot-pay" style="margin-top:4px">'+money(hrSal/30)+'</div>':''):'<span class="badge" style="background:var(--red-bg);color:var(--red-text)">Exceeds limit</span>')+'</div></div>';
    }).join('');
    holPaySection='<div class="card"><div class="card-title">Holiday Pay Days <span style="font-weight:400;font-size:11px">(salary ÷ 30 per day)</span></div>'+
      '<div class="alert alert-success" style="margin-bottom:12px">📅 These days are paid as a flat daily rate — no OT hours.</div>'+holRows+'</div>';
  }

  var holOTSection='';
  if (holOTRecs.length>0) {
    var holOTRows=holOTRecs.map(function(ho){
      var hoOT=calcOT(ho); var hoSal=getSalary(ho.date.slice(0,7));
      return '<div class="ot-row"><div style="display:flex;align-items:center;gap:12px">'+
        '<div class="circle-ot">⏱</div>'+
        '<div><div style="font-weight:600">'+fmtDate(ho.date)+'</div><div class="ot-date">'+ho.dutyOn+'–'+ho.dutyOff+' · '+fmt(hoOT)+' h OT</div></div></div>'+
        '<div style="text-align:right"><div class="ot-hrs">'+fmt(hoOT)+' h</div>'+(hoSal?'<div class="ot-pay">'+money(hoOT*hoSal/240)+'</div>':'')+'</div></div>';
    }).join('');
    holOTSection='<div class="card"><div class="card-title">Holiday Days as OT</div>'+
      '<div class="alert alert-info">ℹ️ These earn OT pay by the hour — no Holiday Pay day consumed.</div>'+holOTRows+'</div>';
  }

  return '<div class="card"><div class="card-title">Basic Salary — Select Month</div>'+
    '<div style="margin-bottom:14px;max-width:280px"><label>Month</label><select onchange="updateSalaryMonth(this.value)">'+smOpts+'</select></div>'+
    '<div style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:12px">'+monthName(salaryMonth)+'</div>'+
    '<div style="display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap">'+
      '<div style="flex:1;min-width:220px;max-width:320px"><label>Monthly Basic Salary (LKR)</label>'+
        '<input type="number" min="0" value="'+(curSal||'')+'" placeholder="e.g. 75000" oninput="updateSalary(this.value)"></div>'+
      (curSal?'<div style="flex:1;min-width:200px"><div style="font-size:12px;color:var(--text3);margin-bottom:6px">Calculated rates</div>'+
        '<div style="font-size:13px;color:var(--text2)">OT rate: <strong style="color:var(--text)">'+money(curSal/240)+'</strong> per hour</div>'+
        '<div style="font-size:13px;color:var(--text2);margin-top:4px">Holiday pay: <strong style="color:var(--text)">'+money(curSal/30)+'</strong> per day</div></div>':'') +
    '</div>'+
    (salRows?'<div class="table-wrap" style="margin-top:16px"><table>'+
      '<thead><tr><th>Month</th><th style="text-align:right">Salary</th><th style="text-align:right">OT Rate</th><th style="text-align:right">Holiday Rate</th></tr></thead>'+
      '<tbody>'+salRows+'</tbody></table></div>':'') +
  '</div>'+
  '<div class="card"><div class="card-title">Earnings Summary</div>'+
  '<div class="metric-grid">'+
    '<div class="metric"><div class="metric-label">Total OT Hours</div><div class="metric-value">'+fmt(totalOT)+'</div><div class="metric-sub">working + weekend + hol. OT</div></div>'+
    '<div class="metric"><div class="metric-label">OT Pay</div><div class="metric-value" style="font-size:18px">'+money(earnedOT)+'</div><div class="metric-sub">at each month\'s rate</div></div>'+
    '<div class="metric"><div class="metric-label">Holiday Pay</div><div class="metric-value" style="font-size:18px">'+money(earnedHol)+'</div><div class="metric-sub">'+holEligible+' of '+apprDays+' days</div></div>'+
    '<div class="metric"><div class="metric-label">Total Earnings</div><div class="metric-value" style="font-size:18px;color:var(--green)">'+money(earnedOT+earnedHol)+'</div><div class="metric-sub">OT + Holiday pay</div></div>'+
  '</div></div>'+
  '<div class="card"><div class="card-title">Day-by-Day OT Breakdown</div>'+(otFiltered.length===0?'<div class="empty">No OT recorded yet.</div>':otRows)+'</div>'+
  holPaySection+holOTSection;
}

/* ════════════════════════════════════════════
   TAB 3 – DASHBOARD
   ════════════════════════════════════════════ */
function renderTab3() {
  var dm = dashboardMonth;
  var monthSet={};
  for(var ai=0;ai<attendance.length;ai++) monthSet[attendance[ai].date.slice(0,7)]=true;
  for(var ak in approvedByMonth) monthSet[ak]=true; monthSet[todayStr().slice(0,7)]=true;
  var allMonths=Object.keys(monthSet).sort();
  var dashOpts='<option value="all"'+(dm==='all'?' selected':'')+'>All Months</option>';
  allMonths.forEach(function(m){ dashOpts+='<option value="'+m+'"'+(m===dm?' selected':'')+'>'+monthName(m)+'</option>'; });

  var filtAtt=dm==='all'?attendance:attendance.filter(function(r){return r.date.slice(0,7)===dm;});
  var totalAppr, apprDays;
  if (dm==='all') { totalAppr=totalApprOTHrs(); apprDays=totalApprHolDays(); }
  else { var mA=getApprForMonth(dm); totalAppr=(Number(mA.central)||0)+(Number(mA.provincial)||0); apprDays=Number(mA.holidayDays)||0; }

  var totalOT=filtAtt.reduce(function(s,r){return s+calcOT(r);},0);
  var remHrs=Math.max(0,totalAppr-totalOT);
  var pct=totalAppr>0?Math.min(100,(totalOT/totalAppr)*100):0;
  var holPayRecs=filtAtt.filter(function(r){return r.dayType==='holiday';});
  var holOTRecs=filtAtt.filter(function(r){return r.dayType==='holiday-ot';});
  var recentOT=filtAtt.filter(function(r){return calcOT(r)>0;}).slice(-6).reverse();
  var fillClass=pct>90?' over':pct>70?' warn':'';

  var earnedOT=0;
  filtAtt.forEach(function(r){earnedOT+=calcOT(r)*getPayPerHr(r.date.slice(0,7));});
  var earnedHol=0;
  for(var ehi=0;ehi<holPayRecs.length&&ehi<apprDays;ehi++) earnedHol+=getPayPerDay(holPayRecs[ehi].date.slice(0,7));

  /* Leave summary for selected scope */
  var lvYear = dm==='all' ? todayStr().slice(0,4) : dm.slice(0,4);
  var lb = getLeaveBalance(lvYear);

  var recentRows=recentOT.map(function(r){
    return '<div class="ot-row"><div><div style="font-size:13px;font-weight:500">'+fmtDate(r.date)+'</div><div class="ot-date">'+dayBadge(r.dayType)+'</div></div><div class="ot-hrs">'+fmt(calcOT(r),2)+' h</div></div>';
  }).join('');

  var holPayRows=holPayRecs.map(function(hr,j){
    var hrPay=getPayPerDay(hr.date.slice(0,7));
    return '<div class="ot-row"><div style="display:flex;align-items:center;gap:12px">'+
      '<div class="circle-num">'+(j+1)+'</div>'+
      '<div><div style="font-weight:600">'+fmtDate(hr.date)+'</div><div class="ot-date">'+hr.dutyOn+' – '+hr.dutyOff+'</div></div></div>'+
      '<div style="text-align:right">'+(j<apprDays?'<span class="badge badge-holiday">✓ Approved</span>'+(hrPay?'<div class="ot-pay">'+money(hrPay)+'</div>':''):'<span style="font-size:12px;color:var(--red)">Beyond '+apprDays+' approved</span>')+'</div></div>';
  }).join('');

  var holOTRows='', holOTTotal=0;
  holOTRecs.forEach(function(ho){
    var hoOT=calcOT(ho); holOTTotal+=hoOT; var hoPay=getPayPerHr(ho.date.slice(0,7));
    holOTRows+='<div class="ot-row"><div style="display:flex;align-items:center;gap:12px"><div class="circle-ot">⏱</div>'+
      '<div><div style="font-weight:600">'+fmtDate(ho.date)+'</div><div class="ot-date">'+ho.dutyOn+'–'+ho.dutyOff+' · '+fmt(hoOT,2)+' h</div></div></div>'+
      '<div style="text-align:right"><div class="ot-hrs">'+fmt(hoOT,2)+' h</div>'+(hoPay?'<div class="ot-pay">'+money(hoOT*hoPay)+'</div>':'')+'</div></div>';
  });

  var apprBreakSection='';
  if (dm==='all') {
    var apprMonths=Object.keys(approvedByMonth).sort();
    var apprBreakRows=apprMonths.map(function(aym){
      var am=approvedByMonth[aym]; var amt=(Number(am.central)||0)+(Number(am.provincial)||0);
      var aOT=attendance.filter(function(r){return r.date.slice(0,7)===aym;}).reduce(function(s,r){return s+calcOT(r);},0);
      return '<tr><td><strong>'+monthName(aym)+'</strong></td>'+
        '<td style="text-align:right">'+fmt(amt,2)+' h</td>'+
        '<td style="text-align:right">'+fmt(aOT,2)+' h</td>'+
        '<td style="text-align:right;font-weight:600;color:'+(aOT>=amt?'var(--red)':'var(--green)')+'">'+fmt(Math.max(0,amt-aOT),2)+' h</td></tr>';
    }).join('');
    apprBreakSection='<div class="card"><div class="card-title">Approved OT by Month</div>'+
      (apprMonths.length===0?'<div class="empty">No approved OT entered yet.</div>':
      '<div class="table-wrap"><table><thead><tr><th>Month</th><th style="text-align:right">Approved</th><th style="text-align:right">Done</th><th style="text-align:right">Remaining</th></tr></thead><tbody>'+apprBreakRows+'</tbody></table></div>')+'</div>';
  }

  return '<div class="card no-print" style="margin-bottom:16px">'+
    '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">'+
      '<label style="font-size:12px;font-weight:500;color:var(--text2);margin:0">Viewing</label>'+
      '<select onchange="updateDashboardMonth(this.value)" style="min-width:200px">'+dashOpts+'</select>'+
    '</div></div>'+

  '<div class="metric-grid">'+
    '<div class="metric"><div class="metric-label">OT Completed</div><div class="metric-value">'+fmt(totalOT,2)+' h</div><div class="metric-sub">of '+fmt(totalAppr,2)+' h approved ('+fmt(pct,0)+'%)</div><div class="progress-bar"><div class="progress-fill'+fillClass+'" style="width:'+pct+'%"></div></div></div>'+
    '<div class="metric"><div class="metric-label">OT Remaining</div><div class="metric-value">'+fmt(remHrs,2)+' h</div><div class="metric-sub">'+(dm==='all'?'across all months':monthName(dm))+'</div></div>'+
    '<div class="metric"><div class="metric-label">Holiday Pay Days</div><div class="metric-value">'+holPayRecs.length+' / '+apprDays+'</div><div class="metric-sub">worked of approved</div></div>'+
    '<div class="metric"><div class="metric-label">Total Earnings</div><div class="metric-value" style="font-size:16px">'+money(earnedOT+earnedHol)+'</div><div class="metric-sub">OT + Holiday pay</div></div>'+
    '<div class="metric"><div class="metric-label">Casual Leave ('+lvYear+')</div><div class="metric-value">'+fmt(lb.casualUsed,1)+' / '+MAX_CASUAL+'</div><div class="metric-sub">'+fmt(lb.casualRem,1)+' remaining</div><div class="progress-bar"><div class="progress-fill'+(lb.casualUsed>MAX_CASUAL*0.8?' warn':'')+'" style="width:'+clamp(lb.casualUsed/MAX_CASUAL*100,0,100)+'%"></div></div></div>'+
    '<div class="metric"><div class="metric-label">Sick Leave ('+lvYear+')</div><div class="metric-value">'+fmt(lb.sickUsed,1)+' / '+MAX_SICK+'</div><div class="metric-sub">'+fmt(lb.sickRem,1)+' remaining</div><div class="progress-bar"><div class="progress-fill'+(lb.sickUsed>MAX_SICK*0.8?' warn':'')+'" style="width:'+clamp(lb.sickUsed/MAX_SICK*100,0,100)+'%"></div></div></div>'+
  '</div>'+

  '<div class="split-grid">'+apprBreakSection+
    '<div class="card"><div class="card-title">Recent OT Days</div>'+(recentOT.length===0?'<div class="empty">No OT recorded.</div>':recentRows)+'</div>'+
  '</div>'+

  '<div class="card"><div class="card-title">Holiday Pay Tracker</div>'+
    (holPayRecs.length===0?'<div class="empty">No "Public Holiday (Holiday Pay)" days recorded.</div>':
    holPayRows+'<div style="border-top:1px solid var(--border);margin-top:8px;padding-top:10px;display:flex;justify-content:space-between;font-size:13px">'+
      '<span style="color:var(--text2)">Eligible: '+Math.min(holPayRecs.length,apprDays)+' of '+apprDays+' days</span>'+
      '<span style="font-weight:600;color:var(--green)">'+money(earnedHol)+'</span></div>')+'</div>'+

  (holOTRecs.length>0?'<div class="card"><div class="card-title">Holiday Days Worked as OT</div>'+
    '<div class="alert alert-info">ℹ️ These days are paid as OT hours — no Holiday Pay days consumed.</div>'+holOTRows+
    '<div style="border-top:1px solid var(--border);margin-top:8px;padding-top:10px;display:flex;justify-content:space-between;font-size:13px">'+
      '<span style="color:var(--text2)">'+holOTRecs.length+' holiday OT day(s)</span>'+
      '<span style="font-weight:600;color:var(--green)">'+money(holOTRecs.reduce(function(s,r){return s+calcOT(r)*getPayPerHr(r.date.slice(0,7));},0))+'</span></div></div>':'');
}

/* ════════════════════════════════════════════
   TAB 4 – LEAVE BALANCE
   ════════════════════════════════════════════ */
function renderTab4() {
  var years = allDataYears();
  var yearOpts = years.map(function(y){ return '<option value="'+y+'"'+(y===leaveYear?' selected':'')+'>'+y+'</option>'; }).join('');
  var lb = getLeaveBalance(leaveYear);
  var currentYM = leaveYear + '-' + (new Date().getMonth()+1 < 10 ? '0'+(new Date().getMonth()+1) : (new Date().getMonth()+1));
  var slThisMonth = lb.shortByMonth[currentYM] || 0;
  var graceThisMonth = attendance.filter(function(r){ return r.date.slice(0,7)===currentYM && r.leaveType==='grace'; }).length;

  /* Build short leave + grace day by month table */
  var slMonthRows = '';
  var months = allDataMonths().filter(function(m){ return m.slice(0,4)===leaveYear; });
  months.forEach(function(m){
    var slCount = lb.shortByMonth[m] || 0;
    var gcCount = attendance.filter(function(r){ return r.date.slice(0,7)===m && r.leaveType==='grace'; }).length;
    var exceeded = slCount > MAX_SL;
    var graceExc = gcCount > MAX_GRACE;
    slMonthRows += '<tr><td><strong>'+monthName(m)+'</strong></td>'+
      '<td style="text-align:center">'+(gcCount>0?'<span class="badge badge-grace">'+gcCount+'</span>':'<span style="color:var(--text3)">0</span>')+'</td>'+
      '<td style="text-align:center">'+(graceExc?'<span style="color:var(--red);font-weight:600">⚠️ Exceeded</span>':'<span style="color:var(--green)">OK ('+gcCount+'/'+MAX_GRACE+')</span>')+'</td>'+
      '<td style="text-align:center">'+(slCount>0?'<span class="badge badge-sl">'+slCount+'</span>':'<span style="color:var(--text3)">0</span>')+'</td>'+
      '<td style="text-align:center">'+(exceeded?'<span style="color:var(--red);font-weight:600">⚠️ Exceeded</span>':'<span style="color:var(--green)">OK</span>')+'</td>'+
    '</tr>';
  });

  /* Build full leave records list */
  var leaveRecs = attendance.filter(function(r){
    return r.date.slice(0,4)===leaveYear && isLeaveDay(r);
  }).sort(function(a,b){ return a.date.localeCompare(b.date); });

  var lvRows = leaveRecs.map(function(r){
    var typeLabel, typeCls, deduction;
    if (r.dayType==='leave-casual') { typeLabel='Casual Leave'; typeCls='badge-lc'; deduction='1 day'; }
    else if (r.dayType==='leave-sick') { typeLabel='Sick/Rest Leave'; typeCls='badge-ls'; deduction='1 day'; }
    else if (r.leaveType==='short-am'||r.leaveType==='short-pm') { typeLabel=leaveTypeLabel(r.leaveType); typeCls='badge-sl'; deduction='—'; }
    else if (r.leaveType==='half-morning'||r.leaveType==='half-noon') {
      typeLabel=leaveTypeLabel(r.leaveType); typeCls='badge-hd';
      deduction='0.5 day ('+(r.halfLeavePool==='sick'?'Sick':'Casual')+')';
    } else { typeLabel=''; typeCls=''; deduction=''; }

    return '<tr>'+
      '<td><strong>'+fmtDate(r.date)+'</strong></td>'+
      '<td><span class="badge '+typeCls+'">'+typeLabel+'</span></td>'+
      '<td style="text-align:center">'+deduction+'</td>'+
      '<td style="text-align:center">'+
        '<button class="appr-btn '+(r.leaveApproved?'approved':'pending')+'" onclick="toggleLeaveApproval(\''+r.id+'\')">'+(r.leaveApproved?'✓ Approved':'⏳ Pending')+'</button>'+
      '</td>'+
      '<td><button class="btn btn-sm" onclick="startEdit(\''+r.id+'\')">Edit</button></td>'+
    '</tr>';
  }).join('');

  var casualPct = clamp(lb.casualUsed/MAX_CASUAL*100,0,100);
  var sickPct   = clamp(lb.sickUsed/MAX_SICK*100,0,100);
  var totalPct  = clamp(lb.totalUsed/(MAX_CASUAL+MAX_SICK)*100,0,100);

  return '<div class="card no-print"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">'+
    '<div class="card-title" style="margin:0">Leave Year</div>'+
    '<select onchange="updateLeaveYear(this.value)" style="width:auto">'+yearOpts+'</select>'+
  '</div></div>'+

  '<div class="info-box">'+
    '<strong>Leave Entitlements:</strong> '+
    '<strong>'+MAX_CASUAL+'</strong> Casual Leave days + '+
    '<strong>'+MAX_SICK+'</strong> Sick/Rest Leave days = '+
    '<strong>'+(MAX_CASUAL+MAX_SICK)+'</strong> Full Day Leaves per year. &nbsp;|&nbsp; '+
